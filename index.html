<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motomachi Open World</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.45 ui-monospace, Consolas, monospace; color: #e8eef5; }
  #c { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #hud { position: fixed; left: 12px; top: 10px; white-space: pre; text-shadow: 0 1px 2px #000, 0 0 6px #000; pointer-events: none; }
  #help { position: fixed; left: 12px; bottom: 10px; white-space: pre; text-shadow: 0 1px 2px #000, 0 0 6px #000; pointer-events: none; transition: opacity .4s; }
  #msg { position: fixed; inset: 0; display: none; place-content: center; text-align: center; background: #0b0f14; font-size: 15px; padding: 24px; }
  #msg { display: grid; }
  #prompt { position: fixed; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 16px; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none; }
</style>
</head>
<body data-assets="assets/">
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="help">クリック（またはドラッグ）で視点操作   WASD 移動   Shift 走る   V 一人称/三人称
E 車の乗り降り   車内: W/S アクセル・後退  A/D ハンドル  Space ブレーキ
L 赤色灯   Z/C 左右のウインカー（曲がるときは自動で点滅）
F 飛行カメラ (Q/E 上下)   T 時間を進める/止める   [ ] 時刻 ±1h   - = 解像度   H 表示切替</div>
<div id="prompt"></div>
<div id="msg">読み込み中…</div>
<script type="module" src="main.js"></script>
</body>
</html>
